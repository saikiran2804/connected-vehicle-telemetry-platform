services:
  telemetry-ingest:
    build: ./services/telemetry-ingest
    ports:
      - "8000:8000"
    environment:
      SERVICE_NAME: telemetry-ingest

  alerts-processor:
    build: ./services/alerts-processor
    ports:
      - "8001:8000"
    environment:
      SERVICE_NAME: alerts-processor

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - telemetry-ingest
      - alerts-processor
