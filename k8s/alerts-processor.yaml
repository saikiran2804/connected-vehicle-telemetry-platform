# =====================================================================
# ALERTS-PROCESSOR — Deployment + Service
# =====================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: alerts-processor
  namespace: cvtp
  labels:
    app: alerts-processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alerts-processor
  template:
    metadata:
      labels:
        app: alerts-processor
    spec:
      containers:
        - name: alerts-processor
          image: alerts-processor:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: alerts-processor
  namespace: cvtp
spec:
  type: ClusterIP
  selector:
    app: alerts-processor
  ports:
    - port: 80
      targetPort: 8000
